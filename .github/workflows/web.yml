name: 웹·엔진 검증
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  # 운영 배포 도중 새 push가 와도 배포를 중단하지 않는다. PR 검사는 최신 실행만 유지한다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            engine/package-lock.json
      - run: npm ci
        working-directory: engine
      - run: npm run typecheck && npm test
        working-directory: engine
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - run: xvfb-run -a glxinfo -B
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
      - run: xvfb-run -a npm test -- --shard=${{ matrix.shard }}/3
        working-directory: web
        env:
          PARKSIDE_TEST_MESA: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
      - run: xvfb-run -a npm run test:production
        if: matrix.shard == 1
        working-directory: web
        env:
          PARKSIDE_TEST_MESA: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-check-results-${{ matrix.shard }}
          path: web/test-results/
      - uses: actions/upload-artifact@v4
        if: success() && matrix.shard == 1
        with:
          name: parking-web-preview
          path: web/dist/
  training:
    # #11 리뷰 지적사항: training/(학습 파이프라인)이 지금까지 CI에서 전혀 검사되지 않았다.
    # 타입·shape/finite·메모리 누수·seed 재현성 회귀 테스트를 최소한으로 연결한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: training/package-lock.json
      - run: npm ci
        working-directory: training
      - run: npm run typecheck
        working-directory: training
      - run: npm test
        working-directory: training
  local-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:local-api
        working-directory: web
      - run: npm run test:cloudflare
        working-directory: web
  deploy:
    name: 운영 자동 배포
    needs: [web, training, local-api]
    if: >-
      github.repository == 'yumina0616/ai-championship-2026' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 같은 커밋의 문서 검증
        run: |
          python3 scripts/check_docs.py
          python3 -m unittest discover -s tests -v
          git show --format= --check HEAD
      - uses: actions/download-artifact@v4
        with:
          name: parking-web-preview
          path: web/dist
      - name: 최신 main인지 확인
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_SHA" = "$latest_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "더 최신 main이 있어 이 커밋의 배포는 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 검증된 웹과 Worker 배포
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "663aba20dd087e7242771263ce8b2105"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN Secret을 등록해야 합니다."
            exit 1
          fi
          npx --yes wrangler@4.132.0 deploy
      - name: 공개 서비스 상태 확인
        if: steps.latest.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 3 https://mrpark.ai.kr/ --output "$RUNNER_TEMP/mrpark-index.html"
          cmp web/dist/index.html "$RUNNER_TEMP/mrpark-index.html"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 3 https://mrpark.ai.kr/api/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["storage"] == "ready", h'
          echo "배포 완료: https://mrpark.ai.kr/ · commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
