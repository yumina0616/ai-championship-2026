name: 웹·엔진 검증
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            engine/package-lock.json
      - run: npm ci
        working-directory: engine
      - run: npm run typecheck && npm test
        working-directory: engine
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - run: xvfb-run -a glxinfo -B
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
      - run: xvfb-run -a npm test -- --shard=${{ matrix.shard }}/3
        working-directory: web
        env:
          PARKSIDE_TEST_MESA: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
      - run: xvfb-run -a npm run test:production
        if: matrix.shard == 1
        working-directory: web
        env:
          PARKSIDE_TEST_MESA: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-check-results-${{ matrix.shard }}
          path: web/test-results/
      - uses: actions/upload-artifact@v4
        if: success() && matrix.shard == 1
        with:
          name: parking-web-preview
          path: web/dist/
  training:
    # #11 리뷰 지적사항: training/(학습 파이프라인)이 지금까지 CI에서 전혀 검사되지 않았다.
    # 타입·shape/finite·메모리 누수·seed 재현성 회귀 테스트를 최소한으로 연결한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: training/package-lock.json
      - run: npm ci
        working-directory: training
      - run: npm run typecheck
        working-directory: training
      - run: npm test
        working-directory: training
  local-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:local-api
        working-directory: web
